        <p>Action</p>
        <input type="radio" name="action" value ="add">add<br>
        <input type="radio" name="action" value ="subtract">subtract<br>
        <input type="radio" name="action" value ="multiply">multiply<br>
        <input type="radio" name="action" value ="divide">divide<br>
        <br>
        <button type="button" id="calc">Calculate</button>
        <br>
        <p id="result2"></p>


    </form>
    <script>
        const name = document.getElementById('name');
        const result = document.getElementById('result');

        const a = document.getElementById('first');
        const b = document.getElementById('second');
        const add = (a, b) => (a + b);
        const sub = (a, b) => a - b;
        const divide = (a, b) => a / b;
        const multiply = (a, b) => a * b;
        
        const result2 = document.getElementById('result2');
        document.getElementById('calc').addEventListener('click', function(){
            const action = document.querySelector('[name = action]:checked');
            if (a.value === '' || b.value === '' || !action){
                result2.textContent = 'Please input all fields';
                return;
            }
            
            if (action.value === 'add') {
                answer = add(Number(a.value), Number(b.value));
                result2.textContent = answer;
            }
            else if (action.value === 'subtract') {
                answer = sub(Number(a.value), Number(b.value));
                result2.textContent = answer;
            }
            else if (action.value === 'multiply') {
                answer = multiply(Number(a.value), Number(b.value));
                result2.textContent = answer;
            }
            else if (action.value === 'divide') {
                
                answer = divide(Number(a.value), Number(b.value));
                result2.textContent = answer;
                
            }
        });


    </script>
