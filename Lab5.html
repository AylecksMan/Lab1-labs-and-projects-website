<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter I</title>
    <style>
        .i{background-color: black;
            display: inline-block;
        }
        .il,.ir{
            background-color: white;
            display: inline-block;
            width:20px;
            height: 50px;


        }
        .il{
            margin: 12px 5px 10px 0;
        }
        .ir{ margin: 12px 0  10px  5px;

        }

        .l{
            background-color: black;
            display: inline-block;
            height: 50px;
            width: 50px;
            padding-bottom: 30px;
        }
        .lu{
            background-color: green;
            width: 30px;
            height: 50px;
            margin-left: 10px;
            padding-left: 10px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="i">
    <div class="il"></div>
    <div class="ir"></div>
</div>

<div class="l">
    <div class="lu"></div>
</div>

</body>
</html>
